# ==========================================================
# Talent AI System - 一键部署编排
#
# 启动：
#   docker compose up -d
#
# 首次启动后需要给 Ollama 拉取模型（约 2.4GB，只需一次）：
#   docker compose exec ollama ollama pull qwen3:4b
#   docker compose exec ollama ollama pull nomic-embed-text
#
# 访问：
#   接口文档  http://localhost:8000/docs
#   健康检查  http://localhost:8000/
#
# 说明：
#   RERANK_ENABLED=false 时不加载 CrossEncoder 重排模型，
#   改用 RRF 排名融合兜底。好处是无需下载 2GB 模型、
#   服务秒级启动；若想启用精排，改为 true 即可
#   （首次调用时会自动下载模型）。
# ==========================================================

name: talent-ai-system

services:

  # ========================================================
  # MySQL
  # ========================================================

  mysql:

    image: mysql:8.0

    container_name: talent-mysql

    environment:

      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}

      MYSQL_DATABASE: ${DB_NAME:-talent_ai_system}

      TZ: Asia/Shanghai

    command:

      - --character-set-server=utf8mb4

      - --collation-server=utf8mb4_unicode_ci

    ports:

      # 宿主机端口映射，默认 3307：
      # 很多人本机已安装 MySQL 并占用 3306，改用 3307 可避免冲突。
      # 容器内部始终监听 3306，应用通过服务名 mysql 连接，不受影响。
      # 如需更换，在 .env 中设置 DB_HOST_PORT=xxxx
      - "${DB_HOST_PORT:-3307}:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

    restart: unless-stopped

  # ========================================================
  # Ollama（本地大模型服务）
  # ========================================================

  ollama:

    image: ollama/ollama:latest

    container_name: talent-ollama

    ports:

      - "11434:11434"

    volumes:

      # 模型持久化：避免每次重建容器都要重新下载
      - ollama_data:/root/.ollama

    healthcheck:

      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]

      interval: 15s

      timeout: 10s

      retries: 10

      start_period: 20s

    restart: unless-stopped

  # ========================================================
  # 应用
  # ========================================================

  app:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: talent-app

    depends_on:

      mysql:

        condition: service_healthy

      ollama:

        condition: service_started

    environment:

      # -------- MySQL --------
      DB_HOST: mysql

      DB_PORT: 3306

      DB_USER: root

      DB_PASSWORD: ${DB_PASSWORD:-123456}

      DB_NAME: ${DB_NAME:-talent_ai_system}

      # -------- Ollama --------
      OLLAMA_BASE_URL: http://ollama:11434

      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}

      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}

      # -------- 可选开关 --------
      # 容器内默认关闭精排，避免下载 2GB 模型
      RERANK_ENABLED: ${RERANK_ENABLED:-false}

      DEBUG_SQL: "false"

      PRINT_CONTEXT: "false"

      TZ: Asia/Shanghai

    ports:

      - "8000:8000"

    volumes:

      # 向量库：镜像内已预置一份，此处挂载保证写入持久化
      - ./docker/vectors:/app/data/vectors

      # 上传文件与导出结果持久化
      - ./docker/uploads:/app/data/uploads

      - ./docker/output:/app/data/output

    restart: unless-stopped

# ==========================================================
# 数据卷
# ==========================================================

volumes:

  mysql_data:

  ollama_data:
